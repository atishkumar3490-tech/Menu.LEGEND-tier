<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kavya Family Restaurant | Powered by LEGEND</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="toast-container" class="toast-hidden"><span id="toast-message"></span></div>

    <!-- MAIN HOME PAGE -->
    <div id="home-page" class="app-page active-page">
        
        <!-- STICKY ZONE 1: Location & Search -->
        <div class="top-sticky-zone">
            <div class="header-top">
                <div class="location-bar" onclick="requestLocation()">
                    <i class="fa-solid fa-location-crosshairs text-neon"></i>
                    <div class="loc-text">
                        <span id="user-location">Tap to allow location</span>
                        <p class="brand-name">Kavya Family Restaurant <i class="fa-solid fa-chevron-down" style="font-size: 10px;"></i></p>
                    </div>
                </div>
                <div class="header-actions">
                    <!-- एकदम गोल प्रोफाइल आइकन -->
                    <div class="profile-icon" onclick="openPage('login-page')">
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>
            </div>
            
            <div class="search-bar-container">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="search-input" placeholder="Search for Biryani, Rolls..." onkeyup="filterMenu()">
                    <div class="mic-icon"><i class="fa-solid fa-microphone"></i></div>
                </div>
            </div>
        </div>

        <!-- NON-STICKY ZONE: 3D Banner (Edge-to-Edge, Scrolls away) -->
        <div class="banner-zone edge-to-edge shimmer-box">
            <div class="canvas-slide vibrant-bg">
                <div class="canvas-content">
                    <h3 class="pop-3d text-gold">ITEMS AT 50% OFF</h3>
                    <p>Flat 20% OFF on Kavya VIP Tables</p>
                    <button class="explore-btn" onclick="openPage('dining-page')">Order now ></button>
                </div>
            </div>
        </div>

        <!-- STICKY ZONE 2: Horizontal Categories (Sticks below Search) -->
        <div class="category-sticky-zone edge-to-edge">
            <div class="category-scroll">
                <div class="category-item active" onclick="setCategory('All', this)">
                    <div class="cat-icon 3d-pop"><img src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=200&q=80"></div>
                    <span>All</span>
                </div>
                <div class="category-item" onclick="setCategory('Starters', this)">
                    <div class="cat-icon 3d-pop"><img src="https://raw.githubusercontent.com/atishkumar3490-tech/Menu.LEGEND-tier/refs/heads/main/cat-starter-1.jpg"></div>
                    <span>Starters</span>
                </div>
                <div class="category-item" onclick="setCategory('Rolls', this)">
                    <div class="cat-icon 3d-pop"><img src="https://raw.githubusercontent.com/atishkumar3490-tech/Menu.LEGEND-tier/refs/heads/main/cat-rolls-1.jpg"></div>
                    <span>Rolls</span>
                </div>
                <div class="category-item" onclick="setCategory('Paneer', this)">
                    <div class="cat-icon 3d-pop"><img src="https://raw.githubusercontent.com/atishkumar3490-tech/Menu.LEGEND-tier/refs/heads/main/cat-paneer-1.jpg"></div>
                    <span>Paneer</span>
                </div>
                <div class="category-item" onclick="setCategory('Chicken', this)">
                    <div class="cat-icon 3d-pop"><img src="https://raw.githubusercontent.com/atishkumar3490-tech/Menu.LEGEND-tier/refs/heads/main/cat-chicken-1.jpg"></div>
                    <span>Chicken</span>
                </div>
                <div class="category-item" onclick="setCategory('Biryani', this)">
                    <div class="cat-icon 3d-pop"><img src="https://raw.githubusercontent.com/atishkumar3490-tech/Menu.LEGEND-tier/refs/heads/main/cat-biryani-1.jpg"></div>
                    <span>Biryani</span>
                </div>
                <div class="category-item" onclick="setCategory('Curries', this)">
                    <div class="cat-icon 3d-pop"><img src="https://raw.githubusercontent.com/atishkumar3490-tech/Menu.LEGEND-tier/refs/heads/main/cat-curry-1.jpg"></div>
                    <span>Curries</span>
                </div>
                <div class="category-item" onclick="setCategory('Sweets', this)">
                    <div class="cat-icon 3d-pop"><img src="https://raw.githubusercontent.com/atishkumar3490-tech/Menu.LEGEND-tier/refs/heads/main/cat-sweet-1.jpg"></div>
                    <span>Sweets</span>
                </div>
                <div class="category-item" onclick="setCategory('Beverages', this)">
                    <div class="cat-icon 3d-pop"><img src="https://raw.githubusercontent.com/atishkumar3490-tech/Menu.LEGEND-tier/refs/heads/main/cat-bevrages-1.jpg"></div>
                    <span>Beverages</span>
                </div>
            </div>
        </div>

        <!-- MAIN MENU (Edge-to-Edge Cards) -->
        <main class="menu-container edge-to-edge" id="menu-items"></main>

        <div class="vip-footer">
            <a href="https://www.instagram.com/kavyafamilyrestaurant?stkn=MWNxZ3hjMzR1eGJ0eQ==" target="_blank" class="insta-link"><i class="fa-brands fa-instagram"></i> Follow us on Instagram</a>
            <div class="powered-by-footer" style="margin-top: 15px;">POWERED BY <span class="legend-text">LEGEND</span></div>
        </div>
        <div style="height: 100px;"></div>
    </div> 

    <!-- SMART TASKBAR (Shrinks on scroll) -->
    <nav class="bottom-taskbar" id="smart-taskbar">
        <div class="nav-item active" onclick="openPage('home-page')"><i class="fa-solid fa-house"></i><span>Delivery</span></div>
        <div class="nav-item" onclick="openPage('dining-page')"><i class="fa-solid fa-bell-concierge"></i><span>Dining</span></div>
        <div class="nav-item cart-nav" onclick="openPage('cart-page')">
            <i class="fa-solid fa-cart-shopping"></i><span>Cart</span>
            <div class="cart-badge hidden" id="nav-cart-count">0</div>
        </div>
    </nav>

    <!-- OTHER PAGES (Dining, Cart, Login remains same as dynamically injected or standard side sheets) -->
    <!-- ... (Keep your existing Cart, Login, and Dining Pages here) ... -->

    <script src="app.js"></script>
</body>
</html>
